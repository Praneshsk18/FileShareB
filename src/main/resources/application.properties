spring.application.name=File_Sharing

# Railway injects the PORT environment variable dynamically
server.port=${PORT:8081}

# Database credentials (injected via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.eoywndmdfodhuxdntnad}
spring.datasource.password=${DB_PASSWORD:Pranesh@134}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Hikari Connection Pool Settings for Cloud & Supabase Poolers
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Explicit PostgreSQL dialect to avoid metadata check failure on startup
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Backblaze B2 / S3 Storage Credentials
b2.bucket-name=${B2_BUCKET_NAME:fileshare-storage}
b2.endpoint=${B2_ENDPOINT:https://s3.ca-east-006.backblazeb2.com}
b2.region=${B2_REGION:ca-east-006}
b2.key-id=${B2_KEY_ID:006b957399db92b0000000003}
b2.application-key=${B2_APPLICATION_KEY:K006cyP0wOQxAuzOqosZlSa+sc+daCc}

# JWT Authentication
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080,https://file-share-gamma-sooty.vercel.app}

# Orphan upload cleanup
upload.cleanup.cron=${UPLOAD_CLEANUP_CRON:0 0 * * * *}
upload.cleanup.max-age-hours=${UPLOAD_CLEANUP_MAX_AGE_HOURS:24}

# Production Swagger Toggle
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}